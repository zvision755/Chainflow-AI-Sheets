name: Test all modes and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check release version
        run: |
          node -e "const r=process.env.GITHUB_REF; if(r.startsWith('refs/tags/v') && r.slice(11)!==require('./package.json').version) throw Error('Release tag and package version differ')"
      - run: npm run typecheck
      - run: npm test
      - name: Build Server Docker
        run: npm run build:docker
        env:
          CHAINFLOW_DEPLOYMENT: server
          CHAINFLOW_BUILD_DIR: dist-server
      - name: Build Local Docker
        run: npm run build:docker
        env:
          CHAINFLOW_DEPLOYMENT: local-docker
          CHAINFLOW_BUILD_DIR: dist-local-docker
      - name: Build Local Pages
        run: npm run build:static
      - run: npx playwright install --with-deps chromium
      - name: Cross-mode editor and adapter regressions
        run: npm run test:ui:modes
      - name: Check public artifact
        run: node scripts/check-static-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: local-pages
          path: dist-static
          if-no-files-found: error
  pages:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-pages
          path: dist-static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
      - id: deploy
        uses: actions/deploy-pages@v4
  docker:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        mode: [server, local-docker]
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + require('./package.json').version + '\n')"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.mode }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAINFLOW_DEPLOYMENT=${{ matrix.mode }}
            CHAINFLOW_VERSION=${{ steps.version.outputs.value }}
