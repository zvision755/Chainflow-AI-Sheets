name: chainflow-local
services:
  app:
    image: ${CHAINFLOW_LOCAL_IMAGE:-chainflow-ai-sheets-local:0.4.0}
    build:
      context: .
      args:
        CHAINFLOW_DEPLOYMENT: local-docker
        HTTP_PROXY: "${CHAINFLOW_LOCAL_HTTP_PROXY:-}"
        HTTPS_PROXY: "${CHAINFLOW_LOCAL_HTTP_PROXY:-}"
    ports:
      - "${CHAINFLOW_LOCAL_BIND_ADDRESS:-127.0.0.1}:${CHAINFLOW_LOCAL_PORT:-3004}:8080"
    environment:
      CHAINFLOW_HTTP_PROXY: "${CHAINFLOW_LOCAL_HTTP_PROXY:-}"
      CHAINFLOW_LAN_ACCESS: "${CHAINFLOW_LOCAL_LAN_ACCESS:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
